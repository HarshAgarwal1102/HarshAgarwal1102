name: Latest blog posts

on:
  schedule:
    - cron: "30 3 * * 1" # Mondays, 03:30 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: blog-posts
  cancel-in-progress: true

jobs:
  update-readme:
    name: Sync Medium posts into README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the refreshed post list
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the post list
        uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: https://medium.com/feed/@harshagarwal2225
          max_post_count: 3
          template: "- [$title]($url) <sub>· $date</sub>$newline"
          date_format: mmm yyyy
          commit_message: "docs: refresh latest blog posts"
          committer_username: github-actions[bot]
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
