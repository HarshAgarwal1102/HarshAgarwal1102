<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Harsh Agarwal, DevSecOps and Cloud Engineer">
  <title>Harsh Agarwal, DevSecOps &amp; Cloud Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F9FD"/><stop offset="1" stop-color="#EAF0FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D9E2F2" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="930" cy="150" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8630A" stop-opacity=".22"/><stop offset="1" stop-color="#E8630A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .flow { animation: flow 1.6s linear infinite; }
      .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 930px 150px; }
      .fade { animation: fade 1s ease-out both; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.9); opacity: 0; } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .fade { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g class="fade">
    <text x="60" y="78" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#E8630A" letter-spacing="2">~/harsh-agarwal $ terraform apply</text>
    <text x="58" y="138" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#0B1020" letter-spacing="-1">Harsh Agarwal</text>
    <text x="60" y="180" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#475571">DevSecOps &amp; Cloud Engineer · Azure Platform &amp; Automation</text>
    <rect x="60" y="214" width="63.0" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".45"/><text x="91.5" y="233" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Azure</text><rect x="133.0" y="214" width="95.8" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".45"/><text x="180.9" y="233" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Terraform</text><rect x="238.8" y="214" width="104.0" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".45"/><text x="290.8" y="233" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">Kubernetes</text><rect x="352.8" y="214" width="95.8" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".45"/><text x="400.7" y="233" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">DevSecOps</text><rect x="458.6" y="214" width="71.2" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".45"/><text x="494.2" y="233" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155">FinOps</text>
    <text x="60" y="272" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" fill="#475571" opacity=".85">scalable · secure · governed · cost-aware</text>
  </g>

  <line x1="930" y1="150" x2="790" y2="62" stroke="#2563EB" stroke-opacity=".35" stroke-width="2"/><line class="flow" style="animation-delay:-0.0s" x1="930" y1="150" x2="790" y2="62" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/><line x1="930" y1="150" x2="1070" y2="62" stroke="#2563EB" stroke-opacity=".35" stroke-width="2"/><line class="flow" style="animation-delay:-0.4s" x1="930" y1="150" x2="1070" y2="62" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/><line x1="930" y1="150" x2="760" y2="238" stroke="#2563EB" stroke-opacity=".35" stroke-width="2"/><line class="flow" style="animation-delay:-0.8s" x1="930" y1="150" x2="760" y2="238" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/><line x1="930" y1="150" x2="1100" y2="238" stroke="#2563EB" stroke-opacity=".35" stroke-width="2"/><line class="flow" style="animation-delay:-1.2s" x1="930" y1="150" x2="1100" y2="238" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/><line x1="930" y1="150" x2="930" y2="268" stroke="#2563EB" stroke-opacity=".35" stroke-width="2"/><line class="flow" style="animation-delay:-1.6s" x1="930" y1="150" x2="930" y2="268" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 6"/>
  <circle class="pulse" cx="930" cy="150" r="34" fill="none" stroke="#E8630A" stroke-width="2"/>
  <circle cx="930" cy="150" r="36" fill="#FFFFFF" stroke="#E8630A" stroke-width="2.5"/>
  <text x="930" y="148" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" font-weight="700" fill="#E8630A">HUB</text>
  <text x="930" y="164" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="9.5" fill="#334155">firewall</text>
  <g><rect x="750.6" y="47" width="78.8" height="30" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".7"/><text x="790" y="67" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" fill="#334155">Identity</text></g><g><rect x="1023.0" y="47" width="94.0" height="30" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".7"/><text x="1070" y="67" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" fill="#334155">Management</text></g><g><rect x="724.4" y="223" width="71.2" height="30" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".7"/><text x="760" y="243" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" fill="#334155">Corp LZ</text></g><g><rect x="1056.8" y="223" width="86.4" height="30" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".7"/><text x="1100" y="243" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" fill="#334155">Online LZ</text></g><g><rect x="894.4" y="253" width="71.2" height="30" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".7"/><text x="930" y="273" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" fill="#334155">On-Prem</text></g>
</svg>
